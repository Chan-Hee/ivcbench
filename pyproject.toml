[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivcbench"
version = "1.2.5"
description = "An immune-aware benchmark of perturbation-prediction generalization"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "pyyaml",
                "matplotlib", "python-docx"]  # figure + Word export are part of the paper cycle

[project.optional-dependencies]
# heavy stack for real data + foundation/latent/OT/graph baselines (install per-family conda env)
full = ["anndata", "scanpy", "torch", "rdkit"]
dev = ["pytest", "black==25.1.0"]

[tool.black]
line-length = 88
target-version = ["py310"]
preview = true
enable-unstable-feature = ["string_processing"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
